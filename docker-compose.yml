version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: esas
    ports:
      - "3306:3306"
    volumes:
      - ./DatabaseScript/esas.sql:/docker-entrypoint-initdb.d/esas.sql

  web:
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: esas
      DB_USER: root
      DB_PASSWORD: root
    depends_on:
      - db
