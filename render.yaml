services:
  - type: web
    name: exam-seating-arrangement-system
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: esas-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: esas-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: esas-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: esas-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: esas-db
          property: database

databases:
  - name: esas-db
    databaseName: esas
    user: esas_user
    plan: free
